<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato — Ricardo Zanlorenzi</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos usados só nesta página: botão de e-mail */
    .botao-email {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #0b5cad;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .botao-email:hover {
      background: #084a8c;
    }

    /* Formulário de contato */
    .formulario label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }
    .formulario input,
    .formulario textarea {
      display: block;
      width: 100%;
      box-sizing: border-box; /* a largura inclui a borda, para não passar da tela */
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid #c9bfa6;
      border-radius: 6px;
      font: inherit;
      background: #fff;
    }
    .formulario button {
      margin-top: 16px;
      border: none;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="projects.html">Projetos</a>
    <a href="sobre.html">Sobre</a>
    <a href="contato.html" aria-current="page">Contato</a>
  </nav>

  <h1>Contato</h1>
  <p>Quer conversar sobre um projeto, tirar uma dúvida ou só dar um oi? Escolha o jeito mais fácil para você.</p>

  <!-- "mailto:" abre o programa de e-mail com uma mensagem nova para mim -->
  <p><a class="botao-email" href="mailto:ricardozanlorenzimd@gmail.com">Me mande um e-mail</a></p>

  <ul>
    <li>Instagram: <a href="https://www.instagram.com/ricardozanlorenzimd/">@ricardozanlorenzimd</a></li>
    <li>GitHub: <a href="https://github.com/ricardozanlorenzimd">ricardozanlorenzimd</a></li>
  </ul>

  <h2>Ou me mande uma mensagem por aqui</h2>
  <!-- O Formspree recebe o formulário e me encaminha por e-mail (formulário xoeeoooq em formspree.io) -->
  <form class="formulario" action="https://formspree.io/f/xoeeoooq" method="POST">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" autocomplete="name" required>

    <label for="email">Seu e-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

    <!-- Assunto do e-mail que chega para mim -->
    <input type="hidden" name="_subject" value="Nova mensagem pelo site">

    <button class="botao-email" type="submit">Enviar mensagem</button>
  </form>
</body>
</html>
